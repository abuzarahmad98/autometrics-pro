<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Editor - Mahindra Metrics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #009696 0%, #006b6b 100%);
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .stat-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .master-badge {
            background: rgba(245,166,35,0.3);
            border: 1px solid rgba(245,166,35,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ── Main Layout ── */
        .main-layout {
            display: flex;
            height: calc(100vh - 72px);
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e8e8e8;
            background: #fafafa;
        }

        .sidebar-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #009696;
            box-shadow: 0 0 0 3px rgba(0,150,150,0.1);
        }

        .metric-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .metric-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            gap: 10px;
        }

        .metric-item:hover {
            background: #f0f7f7;
        }

        .metric-item.active {
            background: #e0f2f2;
            border: 1px solid #009696;
        }

        .metric-item .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .metric-item .status-dot.configured {
            background: #27ae60;
        }

        .metric-item .status-dot.unconfigured {
            background: #e74c3c;
        }

        .metric-item .metric-info {
            flex: 1;
            min-width: 0;
        }

        .metric-item .metric-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .metric-item .metric-unit {
            font-size: 11px;
            color: #999;
            margin-top: 1px;
        }

        .metric-item .metric-views {
            display: flex;
            gap: 3px;
            margin-top: 3px;
        }

        .view-dot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            color: white;
        }

        .view-dot.configured {
            background: #27ae60;
        }

        .view-dot.unconfigured {
            background: #ddd;
            color: #999;
        }

        /* ── Editor Area ── */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }

        .editor-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .editor-title h2 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .editor-title .metric-badge {
            background: #009696;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ── Canvas Container ── */
        .canvas-container {
            position: relative;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: visible;
            border: 2px solid #e0e0e0;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container canvas {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            object-fit: contain;
        }

        .canvas-instructions {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s;
        }

        /* ── Controls Panel ── */
        .controls-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 0.6fr auto;
            gap: 16px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group input,
        .control-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .control-group input:focus,
        .control-group select:focus {
            border-color: #009696;
            box-shadow: 0 0 0 3px rgba(0,150,150,0.1);
        }

        .control-group input[type="color"] {
            width: 44px;
            height: 36px;
            padding: 2px;
            cursor: pointer;
        }

        /* ── View Status Panel ── */
        .view-status-panel {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .view-status-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .view-status-list {
            display: flex;
            gap: 12px;
        }

        .view-status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #eee;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .view-status-item.active {
            border-color: #009696;
            background: #f0fafa;
        }

        .view-status-item.has-data {
            border-color: #27ae60;
        }

        .view-status-item.active.has-data {
            border-color: #009696;
            background: #e8f5e9;
        }

        .view-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .view-status-dot.configured {
            background: #27ae60;
        }

        .view-status-dot.unconfigured {
            background: #ddd;
        }

        .view-status-label {
            color: #555;
        }

        .ppt-badge {
            background: #009696;
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        /* ── Buttons ── */
        .btn-group {
            display: flex;
            gap: 8px;
            align-items: end;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-save {
            background: #009696;
            color: white;
        }

        .btn-save:hover {
            background: #007a7a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,150,150,0.3);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #666;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: #fee;
            color: #e74c3c;
        }

        .btn-delete:hover {
            background: #fdd;
        }

        .btn-delete-view {
            background: #fff3e0;
            color: #e65100;
        }

        .btn-delete-view:hover {
            background: #ffe0b2;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ── Coordinate Display ── */
        .coords-display {
            background: white;
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            gap: 24px;
            font-size: 13px;
        }

        .coord-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coord-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .coord-dot.start { background: #27ae60; }
        .coord-dot.end { background: #e74c3c; }

        .coord-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #555;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }

        /* ── Empty State ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            gap: 12px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 15px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div>
            <h1>Arrow Configuration Editor</h1>
            <div class="subtitle">Click on the image to place arrow start and end points • Multi-view support</div>
        </div>
        <div class="header-stats">
            <span class="master-badge" id="masterCarBadge">Loading...</span>
            <span class="stat-badge" id="stats-configured">Configured: 0/0</span>
        </div>
    </div>

    <div class="main-layout">
        <!-- Sidebar: Metric List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Metrics</h2>
                <input type="text" class="search-box" id="searchBox" placeholder="Search metrics...">
            </div>
            <div class="metric-list" id="metricList">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Editor Area -->
        <div class="editor-area" id="editorArea">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
                </svg>
                <p>Select a metric from the sidebar to start editing</p>
                <p style="font-size: 12px; color: #bbb;">Each metric can have arrows on Side, Front, and Top views</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="/static/editor.js"></script>
</body>
</html>
